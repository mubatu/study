name = "study"
main = "worker/index.ts"
compatibility_date = "2026-05-03"
# Serve production only from the custom domain. Preview URLs would share the production D1 database.
routes = [{ pattern = "study.mubatu.com", custom_domain = true }]
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only API calls run the Worker; pages, scripts and /privacy are served directly.
run_worker_first = ["/api/*"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "study"
database_id = "3a9d7c3c-977d-43e1-82ab-993de4c70bee"
migrations_dir = "migrations"

[vars]
# OAuth 2.0 Web client ID from Google Cloud Console. It is public, not a secret.
GOOGLE_CLIENT_ID = "775579213371-0ekotvgv3a7j9jmndos6vepniss9a7t0.apps.googleusercontent.com"
